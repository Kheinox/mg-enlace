<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>Enlace</title>
<style>html,body{background:#0b0d10;color:#8a9099;font:16px system-ui;margin:0;height:100%;display:grid;place-items:center}</style>
</head><body><p id="m">Cargando…</p>
<script>
fetch('enlace.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{
  if(d&&/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(d.url)){location.replace(d.url)}
  else{document.getElementById('m').textContent='No disponible'}
}).catch(()=>{document.getElementById('m').textContent='No disponible'});
</script></body></html>
